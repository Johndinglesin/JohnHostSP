name: Check sites

on:
  schedule:
    - cron: "23 * * * *"    # every hour at :23 (off-peak minutes are more reliable than :00)
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write            # lets the bot commit status.json
  pages: write               # lets the workflow deploy to GitHub Pages
  id-token: write            # required by the Pages deploy action

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node check.js
      - name: Save results
        run: |
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add status.json
          git commit -m "Update status" || { echo "No changes to save"; exit 0; }
          git push

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # get the commit the bot just pushed
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
