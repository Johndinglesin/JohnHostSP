name: Check sites

on:
  schedule:
    - cron: "0 * * * *"     # every hour
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write            # lets the bot commit status.json
  pages: write               # lets the bot redeploy GitHub Pages

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node check.js
      - name: Save results and redeploy site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add status.json
          git commit -m "Update status" || { echo "No changes to save"; exit 0; }
          git push
          # Pushes made by the bot don't trigger a Pages rebuild on their own, so request one
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
